<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Slip Gaji Live - Huabao</title>

        .shift-p { background-color: #dbeafe; color: #1e40af; }
        .shift-m { background-color: #fef3c7; color: #92400e; }

        .skeleton {

        }

            left: 0;

        .izin-bg { background-color: #fed7aa; }
        .off-bg { background-color: #e5e7eb; }

        .alpha-bg { background-color: #fecaca; }
    </style>
</head>
<body class="bg-gray-100 p-3" style="margin: 0; overflow-x: hidden;">

<div id="app"></div>

<script>
// ==================== KONFIGURASI ====================
const API_BASE = 'https://services-mobile.huabao-indonesia.com/api';
const LOGIN_URL = API_BASE + '/login';

// Konstanta perhitungan gaji
const GAPOK = 3928000;
const TUNJ_TETAP = 700000;
const GAJI_POKOK_TUNJANGAN = GAPOK + TUNJ_TETAP;
const INSENTIF_HADIR_MAX = 390000;
const INSENTIF_KELUARGA = 150000;
const UPAH_SEJAM = Math.round(GAJI_POKOK_TUNJANGAN / 173);
const POTONGAN_TETAP = 621197;
const POT_IP_DASAR = 272235;
const POT_IP_INSENTIF = 8824;

// Periode Mei 2026
const PERIODE = '2026-05';
const [TAHUN, BULAN] = PERIODE.split('-');
let BULAN_SEBELUM = parseInt(BULAN) - 1;
let TAHUN_SEBELUM = parseInt(TAHUN);
if (BULAN_SEBELUM === 0) {
    BULAN_SEBELUM = 12;
    TAHUN_SEBELUM--;
}
const START_DATE = `${TAHUN_SEBELUM}-${String(BULAN_SEBELUM).padStart(2,'0')}-21`;
const END_DATE = `${TAHUN}-${BULAN}-20`;

// Jadwal shift
const JADWAL_MEI = {
    '2026-05-01': 'OFF', '2026-05-02': 'P', '2026-05-03': 'M',
    '2026-05-04': 'OFF', '2026-05-05': 'P', '2026-05-06': 'M',
    '2026-05-07': 'P', '2026-05-08': 'M', '2026-05-09': 'P',
    '2026-05-10': 'OFF', '2026-05-11': 'P', '2026-05-12': 'M',
    '2026-05-13': 'OFF', '2026-05-14': 'P', '2026-05-15': 'M',
    '2026-05-16': 'OFF', '2026-05-17': 'P', '2026-05-18': 'M',
    '2026-05-19': 'OFF', '2026-05-20': 'P', '2026-05-21': 'M',
    '2026-05-22': 'OFF', '2026-05-23': 'P', '2026-05-24': 'M',
    '2026-05-25': 'OFF', '2026-05-26': 'P', '2026-05-27': 'M',
    '2026-05-28': 'OFF', '2026-05-29': 'P', '2026-05-30': 'M',
    '2026-05-31': 'OFF'
};

let authToken = null;
let currentUser = null;
let sessionTimer = null;
let currentCalendarData = [];

// ==================== HELPER ====================
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function formatRupiah(angka) {
    return "Rp " + Math.round(angka).toLocaleString('id-ID');
}

function formatTanggal(tglStr) {
    const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const parts = tglStr.split('-');
    if (parts.length === 3) {
        return `${parseInt(parts[2])} ${bulan[parseInt(parts[1])-1]} ${parts[0]}`;
    }
    return tglStr;
}

function getShiftClass(shift) {
    if (shift === 'P') return 'shift-p';
    if (shift === 'M') return 'shift-m';
    if (shift === 'OFF') return 'shift-off';
    return '';
}

function getStatusIcon(status) {
    if (status === '12.00' || status === '12') return '✅';
    if (status === 'IP') return '📝';
    if (status === 'OFF') return '📌';
    if (status === 'CF' || status === 'CT') return '🏠';
    if (status === 'A' || status === 'Alpha') return '⚠️';
    return '❓';
}

// ==================== SESSION ====================
function startSessionTimer() {
    if (sessionTimer) clearInterval(sessionTimer);
    sessionTimer = setTimeout(() => {
        alert('⚠️ Sesi habis! Silakan login ulang.');
        logout();
    }, 55 * 60 * 1000);
}

function resetSessionTimer() {
    if (sessionTimer) {
        clearTimeout(sessionTimer);
        startSessionTimer();
    }
}

// ==================== LOGIN ====================
async function login(username, password) {
    try {
        const response = await fetch(LOGIN_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'Accept': 'application/json',
                'Origin': 'https://mobile.huabao-indonesia.com',
                'Referer': 'https://mobile.huabao-indonesia.com/'
            },
            body: JSON.stringify({ username: username, password: password })
        });
        const data = await response.json();
        if (response.ok) {
            let token = data.token || data.data?.token || data.access_token;
            let user = data.user || data.data?.user || { name: username, nik: username };
            if (token) return { success: true, token: token, user: user };
            return { success: false, message: 'Token tidak ditemukan' };
        }
        return { success: false, message: data.message || 'Login gagal' };
    } catch (error) {
        return { success: false, message: 'Gagal terhubung ke server' };
    }
}

// ==================== API DATA ====================
async function getAllAttendance() {
    let allData = [];
    let page = 1;
    let lastPage = 1;
    try {
        const firstRes = await fetch(`${API_BASE}/attendance?periode=${PERIODE}-01&page=1`, {
            headers: { "Authorization": `Bearer ${authToken}` }
        });
        const firstJson = await firstRes.json();
        if (firstJson.data) {
            allData = [...firstJson.data];
            lastPage = firstJson.meta?.last_page || 1;
            for (let p = 2; p <= lastPage; p++) {
                const nextRes = await fetch(`${API_BASE}/attendance?periode=${PERIODE}-01&page=${p}`, {
                    headers: { "Authorization": `Bearer ${authToken}` }
                });
                const nextJson = await nextRes.json();
                if (nextJson.data) allData = [...allData, ...nextJson.data];
            }
        }
        return allData;
    } catch (error) {
        return [];
    }
}

function hitungRekap(data) {
    let hadir = 0, ip = 0, sakit = 0, off = 0, alpa = 0, cuti = 0, totalJamKerja = 0;
    data.forEach(item => {
        const aktual = item.aktual;
        if (aktual === '12.00' || aktual === '12') {
            hadir++;
            totalJamKerja += 12;
        } else if (aktual === 'IP') ip++;
        else if (aktual === 'OFF') off++;
        else if (aktual === 'SK' || aktual === 'Sakit') sakit++;
        else if (aktual === 'A' || aktual === 'Alpha') alpa++;
        else if (aktual === 'CF' || aktual === 'CT') cuti++;
        else {
            const jam = parseFloat(aktual);
            if (!isNaN(jam) && jam > 0) {
                hadir++;
                totalJamKerja += jam;
            }
        }
    });
    const jamNormal = hadir * 12;
    const jamLembur = Math.max(0, totalJamKerja - jamNormal);
    const pendapatanLembur = jamLembur * UPAH_SEJAM;
    const insentifHadir = Math.max(0, INSENTIF_HADIR_MAX - (ip * POT_IP_INSENTIF));
    const potonganAbsen = ip * POT_IP_DASAR;
    const totalPendapatan = GAJI_POKOK_TUNJANGAN + INSENTIF_KELUARGA + insentifHadir + pendapatanLembur;
    const prediksiGaji = totalPendapatan - (POTONGAN_TETAP + potonganAbsen);
    return {
        hadir, ip, sakit, off, alpa, cuti,
        jamLembur: jamLembur.toFixed(1),
        totalJamKerja: totalJamKerja.toFixed(1),
        pendapatanLembur, insentifHadir, potonganAbsen,
        totalPendapatan, prediksiGaji, totalHari: data.length
    };
}

// ==================== MODAL KALENDER ====================
function renderCalendarModal(data) {
    const grid = document.getElementById('modalCalendarGrid');
    if (!grid) return;
    const start = new Date(START_DATE);
    const end = new Date(END_DATE);
    const dates = [];
    let current = new Date(start);
    while (current <= end) {
        dates.push(new Date(current));
        current.setDate(current.getDate() + 1);
    }
    const dataMap = {};
    data.forEach(item => { dataMap[item.date] = item; });
    const hari = ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'];
    let html = '<div class="grid grid-cols-7 gap-1 text-center">';
    for (let i = 0; i < 7; i++) html += `<div class="text-xs font-bold text-gray-500 py-2">${hari[i]}</div>`;
    const firstDay = start.getDay();
    for (let i = 0; i < firstDay; i++) html += `<div class="text-center text-gray-300 text-xs py-3 bg-gray-50 rounded"></div>`;
    for (const date of dates) {
        const dateStr = date.toISOString().split('T')[0];
        const item = dataMap[dateStr];
        const dayNum = date.getDate();
        const jadwal = JADWAL_MEI[dateStr] || '';
        const shiftClass = getShiftClass(jadwal);
        let statusIcon = '◻️', tooltip = `Jadwal: ${jadwal || '-'}`;
        if (item) {
            statusIcon = getStatusIcon(item.aktual);
            tooltip = `${item.aktual} - Jadwal: ${jadwal}`;
        }
        html += `
            <div class="py-2 border rounded-lg ${shiftClass} cursor-help" title="${tooltip}">
                <div class="text-sm font-bold">${dayNum}</div>
                <div class="text-xs font-medium">${jadwal}</div>
                <div class="text-sm">${statusIcon}</div>
            </div>
        `;
    }
    html += '</div>';
    grid.innerHTML = html;
}

function openCalendarModal() {
    const modal = document.getElementById('calendarModal');
    modal.style.display = 'flex';
    renderCalendarModal(currentCalendarData);
}

function closeCalendarModal() {
    document.getElementById('calendarModal').style.display = 'none';
}

// ==================== DASHBOARD ====================
async function loadDataAndRender() {
    document.getElementById('loadingSkeleton').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
    try {
        const allData = await getAllAttendance();
        const filteredData = allData.filter(item => item.date >= START_DATE && item.date <= END_DATE);
        filteredData.sort((a,b) => new Date(a.date) - new Date(b.date));
        currentCalendarData = filteredData;
        const rekap = hitungRekap(filteredData);
        
        document.getElementById('rHadir').innerHTML = rekap.hadir;
        document.getElementById('rIzin').innerHTML = rekap.ip;
        document.getElementById('rCuti').innerHTML = rekap.cuti;
        document.getElementById('rSakit').innerHTML = rekap.sakit;
        document.getElementById('rOff').innerHTML = rekap.off;
        document.getElementById('rAlpha').innerHTML = rekap.alpa;
        document.getElementById('rLemburJam').innerHTML = rekap.jamLembur;
        document.getElementById('rTotalJamKerja').innerHTML = rekap.totalJamKerja;
        document.getElementById('rTotalHari').innerHTML = rekap.totalHari;
        document.getElementById('predGajiBersih').innerHTML = formatRupiah(rekap.prediksiGaji);
        document.getElementById('predPendapatanLembur').innerHTML = formatRupiah(rekap.pendapatanLembur);
        document.getElementById('predInsentifHadir').innerHTML = formatRupiah(rekap.insentifHadir);
        document.getElementById('predPotonganAbsen').innerHTML = formatRupiah(rekap.potonganAbsen);
        document.getElementById('predTotalPendapatan').innerHTML = formatRupiah(rekap.totalPendapatan);
        
        document.getElementById('loadingSkeleton').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        resetSessionTimer();
    } catch (error) {
        alert('Gagal memuat data: ' + error.message);
        document.getElementById('loadingSkeleton').classList.add('hidden');
    }
}

async function refreshData() {
    const btn = document.querySelector('button[onclick="refreshData()"]');
    if (btn) { btn.innerHTML = '🔄 Memuat...'; btn.disabled = true; }
    await loadDataAndRender();
    if (btn) { btn.innerHTML = '🔄 Refresh Data'; btn.disabled = false; }
}

function logout() {
    if (sessionTimer) clearTimeout(sessionTimer);
    localStorage.removeItem('authToken');
    localStorage.removeItem('currentUser');
    authToken = null;
    currentUser = null;
    showLoginPage();
}

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-semibold rounded-xl transition">Login</button>
            </form>
            <p class="text-center text-gray-400 text-xs mt-5">Gunakan username & password asli Anda</p>
        </div>
    `;
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { showLoginPage('Username dan password harus diisi'); return; }
        const btn = e.target.querySelector('button');
        btn.innerText = 'Memproses...';
        btn.disabled = true;
        const result = await login(username, password);
        if (result.success) {
            authToken = result.token;
            currentUser = result.user;
            localStorage.setItem('authToken', authToken);
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            startSessionTimer();
            showDashboard();
        } else {
            btn.innerText = 'Login';
            btn.disabled = false;
            showLoginPage(result.message);
        }
    });
}

// ==================== INIT ====================
function init() {
    const savedToken = localStorage.getItem('authToken');
    const savedUser = localStorage.getItem('currentUser');
    if (savedToken && savedUser) {
        authToken = savedToken;
        currentUser = JSON.parse(savedUser);
        startSessionTimer();
        showDashboard();
    } else {
        showLoginPage();
    }
}

window.logout = logout;
window.refreshData = refreshData;
window.openCalendarModal = openCalendarModal;
window.closeCalendarModal = closeCalendarModal;

init();
</script>
